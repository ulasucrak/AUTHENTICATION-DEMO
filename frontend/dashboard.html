<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel</title>
    <style>
        :root {
            --bg: #f4f4f5;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --muted: #71717a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --success-text: #166534;
            --radius: 0.75rem;
            --shadow: 0 1px 3px rgb(0 0 0 / 0.06), 0 12px 32px rgb(0 0 0 / 0.06);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.875rem 1.25rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .btn-outline {
            padding: 0.45rem 0.9rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn-outline:hover {
            background: #fafafa;
            border-color: #d4d4d8;
        }
        .btn-outline:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        main {
            max-width: 40rem;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 2.5rem;
        }
        .hero {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        .avatar {
            flex-shrink: 0;
            width: 3rem;
            height: 3rem;
            border-radius: 9999px;
            background: linear-gradient(145deg, #3b82f6, #1d4ed8);
            color: #fff;
            font-size: 1.125rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero h1 {
            margin: 0;
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .hero p {
            margin: 0.25rem 0 0;
            font-size: 0.875rem;
            color: var(--muted);
        }
        .grid {
            display: grid;
            gap: 0.75rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1rem 1.125rem;
        }
        .card h2 {
            margin: 0 0 0.75rem;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            padding: 0.5rem 0;
            border-top: 1px solid var(--border);
            font-size: 0.875rem;
        }
        .row:first-of-type {
            border-top: none;
            padding-top: 0;
        }
        .row dt {
            margin: 0;
            color: var(--muted);
            font-weight: 500;
        }
        .row dd {
            margin: 0;
            text-align: right;
            font-weight: 600;
            word-break: break-all;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.6rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--success-text);
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 9999px;
        }
        .hint {
            margin: 1rem 0 0;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <span class="logo">Auth project</span>
        <button type="button" class="btn-outline" onclick="logout()">Çıkış Yap</button>
    </header>
    <main>
        <div class="hero">
            <div class="avatar" id="avatar" aria-hidden="true">?</div>
            <div>
                <h1 id="welcomeTitle">Hoş geldin</h1>
                <p>Oturumun güvenli şekilde açık.</p>
            </div>
        </div>

        <div class="grid">
            <section class="card" aria-labelledby="account-heading">
                <h2 id="account-heading">Hesap</h2>
                <dl>
                    <div class="row">
                        <dt>Ad</dt>
                        <dd id="displayName">—</dd>
                    </div>
                    <div class="row">
                        <dt>E-posta</dt>
                        <dd id="displayEmail">—</dd>
                    </div>
                </dl>
            </section>
            <section class="card" aria-labelledby="status-heading">
                <h2 id="status-heading">Durum</h2>
                <p class="badge" id="statusBadge">Hesap aktif</p>
            </section>
        </div>
        <p class="hint">Bu sayfa yalnızca giriş yapmış kullanıcılar içindir.</p>
    </main>

    <script>
        const token = localStorage.getItem('token')
        const name = localStorage.getItem('name')
        const email = localStorage.getItem('email')

        if (!token) {
            window.location.href = 'index.html'
        }

        const displayName = name || 'Kullanıcı'
        document.getElementById('welcomeTitle').textContent = `Hoş geldin, ${displayName}`
        document.getElementById('displayName').textContent = displayName
        document.getElementById('displayEmail').textContent = email || '—'

        const initials = displayName
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map((part) => part[0].toUpperCase())
            .join('') || '?'
        document.getElementById('avatar').textContent = initials

        function logout() {
            localStorage.removeItem('token')
            localStorage.removeItem('name')
            localStorage.removeItem('email')
            window.location.href = 'index.html'
        }
    </script>
</body>
</html>
