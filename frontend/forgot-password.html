<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre sıfırlama</title>
    <style>
        :root {
            --bg: #f4f4f5;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --muted: #71717a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --radius: 0.75rem;
            --shadow: 0 1px 3px rgb(0 0 0 / 0.06), 0 12px 32px rgb(0 0 0 / 0.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .shell { width: 100%; max-width: 26rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.75rem 1.5rem 1.5rem;
        }
        .brand {
            margin: 0 0 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .lead {
            margin: 0 0 1rem;
            font-size: 0.875rem;
            color: var(--muted);
        }
        .field { margin-bottom: 0.875rem; }
        .field label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #3f3f46;
        }
        .field input {
            width: 100%;
            padding: 0.55rem 0.65rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: #fafafa;
            transition: border-color 0.15s, background 0.15s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.15);
        }
        #code {
            font-size: 1.125rem;
            letter-spacing: 0.25em;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .btn {
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.6rem 1rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .footer {
            margin-top: 1.25rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }
        .footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
        #message:not(:empty) {
            margin-top: 1rem;
            padding: 0.6rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .password-requirements {
            margin: 0.75rem 0 1rem;
            padding: 0.75rem 0.875rem;
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.8125rem;
        }
        .password-requirements-title {
            margin: 0 0 0.35rem;
            font-weight: 600;
            color: #3f3f46;
            font-size: 0.75rem;
        }
        .password-requirements ul {
            margin: 0;
            padding-left: 1.1rem;
            color: #52525b;
        }
        .email-readonly {
            font-size: 0.875rem;
            font-weight: 600;
            word-break: break-all;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="card">
            <p class="brand">Auth project</p>
            <h1>Şifre sıfırlama</h1>

            <div id="step-request">
                <p class="lead">Kayıtlı e-posta adresine 6 haneli bir kod göndeririz.</p>
                <div class="field">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" name="email" placeholder="ornek@mail.com" autocomplete="email">
                </div>
                <button type="button" class="btn" onclick="requestResetCode()">Kod gönder</button>
            </div>

            <div id="step-reset" hidden>
                <p class="lead">Kodu gir ve yeni şifreni belirle.</p>
                <p class="email-readonly" id="pending-email-display"></p>
                <div class="field">
                    <label for="code">E-postadaki kod</label>
                    <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
                </div>
                <div class="field">
                    <label for="password">Yeni şifre</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" aria-describedby="req-list">
                </div>
                <div class="password-requirements" role="region" aria-label="Şifre kuralları">
                    <p class="password-requirements-title">Şifre kuralları</p>
                    <ul id="req-list">
                        <li id="req-length">En az 8 karakter</li>
                        <li id="req-upper">Büyük harf (A–Z)</li>
                        <li id="req-lower">Küçük harf (a–z)</li>
                        <li id="req-number">Rakam (0–9)</li>
                        <li id="req-special">Özel karakter (!@#$%^&amp;*)</li>
                    </ul>
                </div>
                <div class="field">
                    <label for="password2">Yeni şifre (tekrar)</label>
                    <input type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
                </div>
                <button type="button" class="btn" onclick="submitNewPassword()">Şifreyi güncelle</button>
            </div>

            <p class="footer"><a href="index.html">Girişe dön</a></p>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const uniqueRules = [
            { id: 'req-length', test: (p) => p.length >= 8 },
            { id: 'req-upper', test: (p) => /[A-Z]/.test(p) },
            { id: 'req-lower', test: (p) => /[a-z]/.test(p) },
            { id: 'req-number', test: (p) => /[0-9]/.test(p) },
            { id: 'req-special', test: (p) => /[!@#$%^&*]/.test(p) }
        ]

        function updatePasswordRequirements(password) {
            uniqueRules.forEach((rule) => {
                const li = document.getElementById(rule.id)
                const ok = rule.test(password)
                li.style.color = ok ? '#166534' : '#52525b'
                li.style.fontWeight = ok ? '600' : '400'
            })
        }

        document.getElementById('password').addEventListener('input', function () {
            updatePasswordRequirements(this.value)
        })

        document.getElementById('code').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6)
        })

        let pendingEmail = ''

        async function requestResetCode() {
            const email = document.getElementById('email').value.trim()
            const messageDiv = document.getElementById('message')
            messageDiv.textContent = ''

            if (!email) {
                messageDiv.textContent = 'E-posta adresini gir.'
                return
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                })

                const data = await response.json()

                if (!response.ok) {
                    messageDiv.textContent = data.message
                    return
                }

                pendingEmail = email
                document.getElementById('pending-email-display').textContent = pendingEmail
                document.getElementById('step-request').hidden = true
                document.getElementById('step-reset').hidden = false
                document.getElementById('code').value = ''
                document.getElementById('password').value = ''
                document.getElementById('password2').value = ''
                updatePasswordRequirements('')
                document.getElementById('code').focus()
            } catch (err) {
                messageDiv.textContent = 'Sunucuya bağlanılamadı.'
            }
        }

        async function submitNewPassword() {
            const code = document.getElementById('code').value.trim()
            const password = document.getElementById('password').value
            const password2 = document.getElementById('password2').value
            const messageDiv = document.getElementById('message')

            if (!/^\d{6}$/.test(code)) {
                messageDiv.textContent = '6 haneli kodu gir.'
                return
            }
            if (password !== password2) {
                messageDiv.textContent = 'Şifreler eşleşmiyor.'
                return
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingEmail, code, password })
                })

                const data = await response.json()

                if (!response.ok) {
                    messageDiv.textContent = data.message
                    return
                }

                sessionStorage.setItem('resetSuccess', '1')
                sessionStorage.setItem('prefillEmail', pendingEmail)
                window.location.href = 'index.html'
            } catch (err) {
                messageDiv.textContent = 'Sunucuya bağlanılamadı.'
            }
        }
    </script>
</body>
</html>
